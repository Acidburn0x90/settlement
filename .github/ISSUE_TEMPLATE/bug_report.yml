name: Bug Report
description: Report a simulation invariant failure, TPS spike, or in-world bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / Failing Test
      description: Steps or JUnit test case that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
    validations:
      required: true
